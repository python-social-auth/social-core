[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78.0.2"]

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "flake8==7.4.1",
  "pytest-cov==7.1.0",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-profiling==1.8.1",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
  "responses==0.26.3",
  { include-group = "pylint" },
  { include-group = "types" }
]
pylint = [
  "pylint==4.1.2"
]
types = [
  "mypy==2.4.0",
  "pyright==1.1.414",
  "ty==0.0.85",
  "types-defusedxml==0.7.0.20260504",
  "types-lxml==2026.2.16",
  "types-oauthlib==3.3.0.20260724",
  "types-requests-oauthlib==2.0.0.20261006",
  "types-requests==2.33.0.20261006"
]

[project]
authors = [
  { email = "matiasaguirre@gmail.com", name = "Matias Aguirre" },
  { email = "michal@weblate.org", name = "Michal Čihař" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet"
]
dependencies = [
  "cryptography>=46.0.7",
  "defusedxml>=0.7.1",
  "oauthlib>=3.3.1",
  "PyJWT[crypto]>=2.13.0",
  "python3-openid>=3.2.0",
  "requests-oauthlib>=2.0.0",
  "requests>=2.34.0"
]
description = "Python social authentication made simple."
keywords = ["oauth", "openid", "saml", "social auth"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "social-auth-core"
readme = "README.md"
requires-python = ">=3.10"
version = "6.0.0"

[project.optional-dependencies]
all = [
  "social-auth-core[azuread]",
  "social-auth-core[google-onetap]",
  "social-auth-core[saml]",
  "social-auth-core[shopify]"
]
allpy3 = [
  "social-auth-core[all]"
]
# This is present until pip implements supports for PEP 735
# see https://github.com/pypa/pip/issues/12963
dev = [
  "coverage==7.16.2",
  "flake8==7.4.1",
  "mypy==2.4.0",
  "pyright==1.1.414",
  "pytest-cov==7.1.0",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-profiling==1.8.1",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
  "responses==0.26.3",
  "ty==0.0.85",
  "types-defusedxml==0.7.0.20260504",
  "types-lxml==2026.2.16",
  "types-oauthlib==3.3.0.20260724",
  "types-requests-oauthlib==2.0.0.20261006",
  "types-requests==2.33.0.20261006"
]
google-onetap = [
  "google-auth>=2.40.0,<2.61"
]
saml = [
  "python3-saml>=1.16.0"
]
shopify = [
  "ShopifyAPI"
]

[project.urls]
Changelog = "https://github.com/python-social-auth/social-core/blob/master/CHANGELOG.md"
Funding = "https://opencollective.com/python-social-auth"
Homepage = "https://github.com/python-social-auth/social-core"

[tool.check-manifest]
ignore = [
  ".coveragerc",
  ".pre-commit-config.yaml",
  ".well-known/funding-manifest-urls",
  "tox.ini"
]

[tool.codespell]
count = true
ignore-words-list = "assertIn"

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
disallow_untyped_defs = true
ignore_missing_imports = true
module = [
  "google.appengine.*",
  "onelogin.*",
  "openid.*",
  "shopify.*"
]

[tool.pylint.main]
disable = [
  "abstract-method",  # TODO
  "arguments-differ",  # TODO
  "duplicate-code",  # TODO
  "fixme",
  "invalid-name",  # TODO
  "keyword-arg-before-vararg",  # TODO
  "line-too-long",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "no-member",  # TODO
  "too-few-public-methods",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-locals",
  "too-many-positional-arguments",  # TODO
  "too-many-public-methods",
  "unused-argument"
]
extension-pkg-allow-list = ["lxml.etree"]

[tool.pyright]
pythonVersion = "3.10"
reportOptionalMemberAccess = "none"
reportPossiblyUnboundVariable = "none"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "--cov=social_core --cov-report=xml --durations=10"

[tool.ruff.lint]
extend-safe-fixes = [
  "ANN",
  "D",
  "FLY",
  "future-required-type-annotation",
  "SIM",
  "TCH",
  "UP"
]
future-annotations = true
ignore = [
  "ambiguous-unicode-character-string",  # TODO!
  "ANN",  # TODO: Missing type annotations
  "builtin-argument-shadowing",  # TODO!
  "COM",  # CONFIG: No trailing commas
  "commented-out-code",  # TODO: Found commented-out code
  "compare-to-empty-string",  # TODO
  "complex-structure",  # TODO
  "D",  # TODO: Missing documentation
  "docstring-missing-exception",  # TODO
  "docstring-missing-returns",  # TODO
  "explicit-string-concatenation",  # TODO: Explicitly concatenated string should be implicitly concatenated
  "f-string-in-exception",  # TODO: Exception must not use an f-string literal, assign to variable first
  "FBT",  # TODO: Boolean in function definition
  "get-attr-with-constant",  # TODO!
  "global-statement",  # TODO
  "hardcoded-password-string",  # TODO: Possible hardcoded password assigned
  "incorrect-blank-line-before-class",  # CONFIG: incompatible with D211
  "incorrectly-parenthesized-tuple-in-subscript",  # TODO!
  "line-contains-todo",  # CONFIG: we use TODO
  "line-too-long",  # WONTFIX: we accept long strings (rest is formatted by ruff)
  "literal-membership",  # TODO!
  "magic-value-comparison",  # TODO: Magic value used in comparison
  "missing-copyright-notice",  # TODO: Copyright not documented
  "missing-todo-author",  # CONFIG: no detailed TODO documentation is required
  "missing-todo-link",  # CONFIG: no detailed TODO documentation is required
  "multi-line-summary-first-line",  # CONFIG: incompatible with D213
  "mutable-class-default",  # TODO: Type annotations
  "N",  # TODO: Naming issues
  "no-self-use",  # TODO
  "non-augmented-assignment",  # TODO
  "non-empty-init-module",  # TODO
  "PT",  # CONFIG: Not using pytest
  "raise-vanilla-args",  # TODO: Avoid specifying long messages outside the exception class
  "raw-string-in-exception",  # TODO: Exception must not use a string literal, assign to variable first
  "redefined-loop-name",  # TODO: loop variable overwritten by assignment target
  "reimplemented-operator",  # TODO!
  "runtime-cast-value",  # TODO!
  'single-line-implicit-string-concatenation',  # CONFIG: formatter
  "subclass-builtin",  # TODO
  "too-many-arguments",  # TODO
  "too-many-branches",  # TODO
  "too-many-locals",  # TODO
  "too-many-nested-blocks",  # TODO
  "too-many-positional-arguments",  # TODO
  "too-many-public-methods",  # TODO
  "too-many-statements-in-try-clause",  # TODO
  "try-except-in-loop",  # WONTFIX: This rule is only enforced for Python versions prior to 3.11
  "unspecified-encoding",  # TODO
  "unused-class-method-argument",  # TODO: Unused class method argument
  "unused-function-argument",  # TODO: Unused function argument (mostly for API compatibility)
  "unused-method-argument"  # TODO: Unused method argument (mostly for API compatibility)
]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 11  # TODO: should be lower

[tool.ruff.lint.per-file-ignores]
"scripts/check_distribution.py" = ["implicit-namespace-package", "print"]
"social_core/**tests**.py" = ["assert"]
"social_core/pipeline/debug.py" = ["p-print", "print"]

[tool.ruff.lint.pylint]
# TODO: all these should be lower (or use defaults)
max-args = 7
max-branches = 15

[tool.rumdl]
disable = [
  # We do not enforce heading
  "first-line-heading",
  # Avoid length limit checks
  "line-length"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
social_core = [
  "py.typed",
  "static/social_auth/icons/*.svg",
  "static/social_auth/LICENSE.amplify-ui",
  "static/social_auth/NOTICE"
]

[tool.setuptools.packages.find]
exclude = ["social_core.tests", "social_core.tests.*"]
include = ["social_core", "social_core.*"]
namespaces = false

[tool.tomlsort]
ignore_case = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true
spaces_before_inline_comment = 2
